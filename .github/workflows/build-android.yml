# Builds the Ghosthunter Mobile Android app (APK) from the mobile/ folder.
# Download it from the run's "Artifacts" on the Actions tab, or from Releases.
name: Build Android app
on:
  push:
    paths: ["mobile/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Use the signing key from repo secrets, if set
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: mobile
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Name the APK
        run: cp mobile/app/build/outputs/apk/release/app-release.apk "Ghosthunter-Mobile-v5.1.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Ghosthunter-Mobile-APK
          path: Ghosthunter-Mobile-v5.1.apk
